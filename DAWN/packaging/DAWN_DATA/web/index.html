<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DAWN</title>
  <style>
    :root {
      --bg: #1c1c1c;
      --panel: #242424;
      --raised: #2c2c2c;
      --line: #3a3a3a;
      --text: #e8e8e8;
      --muted: #8d8d8d;
      --accent: #ff764d;
      --accent-ink: #2a120c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      display: grid;
      grid-template-rows: 50px minmax(0, 1fr) 250px;
      font: 13px/1.3 "Segoe UI", system-ui, sans-serif;
    }
    header, footer { background: var(--panel); display: flex; align-items: center; gap: 10px; padding: 0 14px; }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); align-items: stretch; padding: 14px; gap: 18px; }
    button, input { font: inherit; color: inherit; }
    button {
      height: 30px; padding: 0 14px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--raised); cursor: pointer;
    }
    button:hover { background: #353535; }
    #play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    #position {
      min-width: 76px; text-align: center; padding: 6px 8px; border-radius: 4px;
      background: #161616; color: var(--text); letter-spacing: 0.04em;
    }
    label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    input[type="number"] {
      width: 64px; height: 30px; border: 1px solid var(--line); border-radius: 4px;
      background: #161616; padding: 0 8px;
    }
    input[type="range"] {
      width: 140px; height: 4px; accent-color: var(--accent); cursor: pointer;
    }
    #session {
      min-height: 0; overflow: auto; padding: 16px;
      display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 10px; align-content: start;
    }
    .track { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
    .name { height: 28px; display: flex; align-items: center; padding: 0 4px; font-weight: 600; }
    .flags { display: flex; gap: 4px; margin: 6px 0 8px; }
    .flags button { width: 28px; padding: 0; }
    .flags button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .clip {
      display: block; width: 100%; height: 56px; margin: 0 0 6px; padding: 8px;
      text-align: left; border-radius: 4px; background: #1a1a1a; color: var(--muted);
    }
    .clip.filled { background: color-mix(in srgb, var(--clip) 28%, #1a1a1a); color: var(--text); border-color: transparent; }
    .clip.filled:hover { filter: brightness(1.15); }
    .clip.launched { background: var(--clip); color: #161616; }
    .device { display: flex; flex-direction: column; gap: 8px; min-width: 180px; }
    .device h2 { margin: 0; font-size: 11px; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; }
    #pads { display: flex; gap: 6px; align-items: flex-end; margin-left: auto; }
    #pads button { width: 72px; height: 48px; }
    #pads button:active { background: var(--accent); color: var(--accent-ink); }
  </style>
</head>
<body>
  <header>
    <button id="play" type="button">Play</button>
    <button id="stop" type="button">Stop</button>
    <span id="position">1.1.1</span>
    <label>BPM <input id="bpm" type="number" min="40" max="220" step="0.1" value="120"></label>
    <label>Master <input id="master" type="range" min="0" max="1" step="0.001" value="0.85"></label>
  </header>
  <main id="session"></main>
  <footer>
    <div class="device">
      <h2>SENDS</h2>
      <label>Reverb <input id="reverb" type="range" min="0" max="1" step="0.001" value="0"></label>
      <label>Delay <input id="delay" type="range" min="0" max="1" step="0.001" value="0"></label>
    </div>
    <div class="device">
      <h2>DEVICE</h2>
      <label>Tone <input id="tone" type="range" min="0" max="1" step="0.001" value="0.5"></label>
      <label>Decay <input id="decay" type="range" min="0" max="1" step="0.001" value="0.4"></label>
      <label>Level <input id="level" type="range" min="0" max="1" step="0.001" value="0.8"></label>
    </div>
    <div id="pads"></div>
  </footer>
  <script>
    const colours = ["#e07a3d", "#4c8dff", "#5daa72", "#a978d1"];
    const pads = [["Kick", 36], ["Snare", 38], ["Hat", 42], ["Open", 46], ["Clap", 39], ["Tom", 45], ["Rim", 37], ["Crash", 49]];

    function backend() { return window.__JUCE__ && window.__JUCE__.backend; }
    function emit(name, payload) {
      const bridge = backend();
      if (bridge && typeof bridge.emitEvent === "function") bridge.emitEvent(name, payload || {});
    }
    function first(value) { return Array.isArray(value) ? value[0] : value; }
    function initValue(name, fallback) {
      const data = window.__JUCE__ && window.__JUCE__.initialisationData;
      const raw = data ? first(data[name]) : undefined;
      const number = Number(raw);
      return Number.isFinite(number) ? number : fallback;
    }
    function bars(beats) {
      if (!(beats > 0)) beats = 0;
      const bar = Math.floor(beats / 4) + 1;
      const inside = beats % 4;
      return bar + "." + (Math.floor(inside) + 1) + "." + (Math.floor((inside % 1) * 4) + 1);
    }

    window.dawn = {
      setTransport(playing, playhead) {
        document.getElementById("play").classList.toggle("on", !!playing);
        document.getElementById("position").textContent = bars(Number(playhead) || 0);
      }
    };

    document.getElementById("play").onclick = () => emit("play");
    document.getElementById("stop").onclick = () => emit("stop");
    document.getElementById("bpm").value = initValue("bpm", 120);
    document.getElementById("master").value = initValue("master", 0.85);
    document.getElementById("bpm").onchange = (event) => emit("slider_moved", { id: "bpm", value: Number(event.target.value) });
    document.getElementById("master").oninput = (event) => emit("slider_moved", { id: "master", value: Number(event.target.value) });
    for (const id of ["reverb", "delay", "tone", "decay", "level"]) {
      document.getElementById(id).oninput = (event) => emit("slider_moved", { id, value: Number(event.target.value) });
    }

    const padRow = document.getElementById("pads");
    for (const [name, note] of pads) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.onpointerdown = (event) => { event.preventDefault(); emit("pad", { note, down: true }); };
      const release = () => emit("pad", { note, down: false });
      button.onpointerup = release;
      button.onpointerleave = release;
      padRow.appendChild(button);
    }

    function sessionData() {
      const data = window.__JUCE__ && window.__JUCE__.initialisationData;
      const text = data ? first(data.session) : "";
      if (!text) return [];
      try { return JSON.parse(text); } catch (error) { return []; }
    }

    const session = document.getElementById("session");
    sessionData().forEach((track, trackIndex) => {
      const column = document.createElement("section");
      column.className = "track";
      const title = document.createElement("div");
      title.className = "name";
      title.textContent = track.name || ("Track " + (trackIndex + 1));
      const flags = document.createElement("div");
      flags.className = "flags";
      for (const [flag, letter] of [["mute", "M"], ["solo", "S"], ["arm", "R"]]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = letter;
        button.onclick = () => {
          button.classList.toggle("on");
          emit("trackFlag", { track: trackIndex, flag, value: button.classList.contains("on") });
        };
        flags.appendChild(button);
      }
      column.append(title, flags);
      (track.clips || []).forEach((clip, scene) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "clip" + (clip.title ? " filled" : "") + (clip.launched ? " launched" : "");
        button.style.setProperty("--clip", colours[scene % colours.length]);
        button.textContent = clip.title || "";
        button.onclick = () => {
          if (!clip.title) return;
          button.classList.toggle("launched");
          emit("launchClip", { track: trackIndex, scene });
        };
        column.appendChild(button);
      });
      session.appendChild(column);
    });
  </script>
</body>
</html>
