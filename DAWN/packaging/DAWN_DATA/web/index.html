<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DAWN</title>
  <style>
    :root {
      --void: #07080c;
      --panel: #14161c;
      --line: #2c3038;
      --lime: #ccff00;
      --amber: #ffb000;
      --cyan: #3ee0ff;
      --ink: #101108;
      --text: #e7ffe4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--void); color: var(--text); font: 13px/1.3 ui-monospace, monospace; }
    body { display: grid; grid-template-rows: 50px 1fr 250px; }
    header, footer { background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
    header { border-bottom: 2px solid var(--lime); }
    footer { border-top: 1px solid var(--line); align-items: flex-start; padding-top: 12px; flex-wrap: wrap; }
    button {
      height: 32px; min-width: 64px; padding: 0 12px; border: 1px solid var(--cyan); background: #171b24;
      color: var(--lime); font: inherit; cursor: pointer;
    }
    button.on, button:active { background: var(--lime); color: var(--ink); border-color: var(--lime); }
    label { color: var(--cyan); display: flex; align-items: center; gap: 6px; }
    input[type="range"] { width: 120px; accent-color: var(--amber); }
    #position { min-width: 72px; text-align: center; color: var(--lime); background: var(--void); padding: 6px 8px; }
    #session { overflow: auto; padding: 12px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(140px, 1fr); gap: 8px; align-content: start; }
    .track { background: var(--panel); min-height: 0; }
    .name { height: 28px; display: flex; align-items: center; padding: 0 8px; border-top: 3px solid var(--lime); }
    .flags { display: flex; gap: 4px; padding: 4px; }
    .flags button { min-width: 28px; width: 28px; padding: 0; }
    .clip { height: 60px; margin: 6px; border: 1px solid transparent; background: #101114; color: inherit; text-align: left; padding: 8px; }
    .clip.filled { border-color: var(--clip, var(--lime)); color: var(--clip, var(--lime)); }
    .clip.launched { background: var(--clip, var(--lime)); color: var(--ink); }
    .knob { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--amber); }
    .knob input { width: 64px; }
    #pads { display: flex; gap: 6px; width: 100%; }
    #pads button { width: 68px; height: 44px; }
    h2 { margin: 0 12px 0 0; font-size: 12px; color: var(--lime); align-self: center; }
  </style>
</head>
<body>
  <header>
    <button id="play" type="button">Play</button>
    <button id="stop" type="button">Stop</button>
    <span id="position">1.1.1</span>
    <label>BPM <input id="bpm" type="range" min="40" max="220" step="0.1" value="120"></label>
    <label>Master <input id="master" type="range" min="0" max="1" step="0.001" value="0.85"></label>
  </header>
  <main id="session"></main>
  <footer>
    <h2>DEVICE</h2>
    <label class="knob">Reverb <input id="reverb" type="range" min="0" max="1" step="0.001" value="0"></label>
    <label class="knob">Delay <input id="delay" type="range" min="0" max="1" step="0.001" value="0"></label>
    <div id="pads"></div>
  </footer>
  <script>
    const colours = ["#ccff00", "#ff7a18", "#b44cff", "#3ec1ff"];
    const pads = [["Kick", 36], ["Snare", 38], ["Hat", 42], ["Open", 46], ["Clap", 39], ["Tom", 45], ["Rim", 37], ["Crash", 49]];

    function backend() { return window.__JUCE__ && window.__JUCE__.backend; }

    function emit(name, payload) {
      const bridge = backend();
      if (!bridge || typeof bridge.emitEvent !== "function") return;
      bridge.emitEvent(name, payload || {});
    }

    function sliderEmit(name, value) {
      emit("__juce__slider" + name, { eventType: "valueChanged", value: Number(value) });
    }

    function callNative(name) {
      const bridge = backend();
      if (bridge && typeof bridge.getNativeFunction === "function") {
        const fn = bridge.getNativeFunction(name);
        if (fn) fn();
        return;
      }
      emit(name, {});
    }

    function bars(beats) {
      if (beats < 0) beats = 0;
      const bar = Math.floor(beats / 4) + 1;
      const inside = beats % 4;
      const beat = Math.floor(inside) + 1;
      const tick = Math.floor((inside - Math.floor(inside)) * 4) + 1;
      return bar + "." + beat + "." + tick;
    }

    window.dawn = {
      setTransport(playing, playhead) {
        document.getElementById("play").classList.toggle("on", !!playing);
        document.getElementById("position").textContent = bars(Number(playhead) || 0);
      }
    };

    document.getElementById("play").onclick = () => callNative("togglePlay");
    document.getElementById("stop").onclick = () => emit("stopClicked");
    document.getElementById("bpm").oninput = (event) => sliderEmit("bpm", event.target.value);
    document.getElementById("master").oninput = (event) => sliderEmit("master", event.target.value);

    const padRow = document.getElementById("pads");
    for (const [name, note] of pads) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.onpointerdown = (event) => { event.preventDefault(); emit("pad", { note, down: true }); };
      button.onpointerup = () => emit("pad", { note, down: false });
      button.onpointerleave = () => emit("pad", { note, down: false });
      padRow.appendChild(button);
    }

    function sessionData() {
      const data = window.__JUCE__ && window.__JUCE__.initialisationData;
      const raw = data && data.session;
      const text = Array.isArray(raw) ? raw[0] : raw;
      if (!text) return [];
      try { return JSON.parse(text); } catch (error) { return []; }
    }

    const session = document.getElementById("session");
    sessionData().forEach((track, trackIndex) => {
      const column = document.createElement("section");
      column.className = "track";
      const title = document.createElement("div");
      title.className = "name";
      title.textContent = track.name || ("Track " + (trackIndex + 1));
      const flags = document.createElement("div");
      flags.className = "flags";
      for (const flag of ["mute", "solo", "arm"]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = flag[0].toUpperCase();
        button.onclick = () => {
          button.classList.toggle("on");
          emit("trackFlag", { track: trackIndex, flag, value: button.classList.contains("on") });
        };
        flags.appendChild(button);
      }
      column.append(title, flags);
      (track.clips || []).forEach((clip, scene) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "clip" + (clip.title ? " filled" : "") + (clip.launched ? " launched" : "");
        button.style.setProperty("--clip", colours[scene % colours.length]);
        button.textContent = clip.title || "";
        button.onclick = () => {
          if (!clip.title) return;
          button.classList.toggle("launched");
          emit("launchClip", { track: trackIndex, scene });
        };
        column.appendChild(button);
      });
      session.appendChild(column);
    });

    window.addEventListener("load", () => {
      emit("__juce__sliderbpm", { eventType: "requestInitialUpdate" });
      emit("__juce__slidermaster", { eventType: "requestInitialUpdate" });
      const bridge = backend();
      if (!bridge || typeof bridge.addEventListener !== "function") return;
      const apply = (name, input) => {
        bridge.addEventListener("__juce__slider" + name, (payload) => {
          if (payload && payload.eventType === "valueChanged" && document.activeElement !== input)
            input.value = payload.value;
        });
      };
      apply("bpm", document.getElementById("bpm"));
      apply("master", document.getElementById("master"));
    });
  </script>
</body>
</html>
